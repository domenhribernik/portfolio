<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0a0a0a">
    <title>Vrata (frame)</title>
    <link rel="icon" type="image/x-icon" href="../../../assets/favicon.ico" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vrata">
    <link rel="apple-touch-icon" href="../icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body class="min-h-[100dvh] bg-neutral-950 text-neutral-100 font-sans antialiased flex flex-col items-center justify-center p-4 sm:p-6"
      style="padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);">

    <main class="w-full flex flex-col items-center gap-4">

        <!-- Key entry view -->
        <section id="keyView" class="hidden w-full max-w-sm sm:max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <h1 class="text-lg font-medium mb-1">Enter key</h1>
            <p class="text-sm text-neutral-400 mb-4">Stored locally on this device only.</p>
            <form id="keyForm" autocomplete="off" novalidate>
                <input
                    id="keyInput"
                    type="password"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    name="k"
                    class="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-3 text-base font-mono tracking-tight outline-none focus:border-neutral-600 focus:ring-1 focus:ring-neutral-600"
                    aria-label="Access key"
                    required>
                <button
                    type="submit"
                    class="mt-3 w-full bg-neutral-100 text-neutral-900 font-medium rounded-lg py-3 text-base hover:bg-white active:bg-neutral-200 transition">
                    Save
                </button>
            </form>
        </section>

        <!-- Action view -->
        <section id="actionView" class="hidden w-full max-w-sm sm:max-w-md md:max-w-4xl lg:max-w-5xl xl:max-w-6xl flex flex-col gap-6">

            <!-- Top bar -->
            <div class="flex items-center justify-between">
                <button
                    id="refreshBtn"
                    type="button"
                    aria-label="Osveži sliko"
                    class="inline-flex items-center gap-1.5 text-xs text-neutral-400 hover:text-neutral-100 active:text-white disabled:opacity-50 disabled:cursor-not-allowed transition px-3 py-2 rounded-lg hover:bg-neutral-900 border border-transparent hover:border-neutral-800">
                    <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M16.023 9.348h4.992V4.356m-4.992 4.992-1.65-1.65a7.5 7.5 0 1 0 1.35 8.577"/>
                    </svg>
                    <span>Osveži</span>
                </button>

                <button
                    id="forgetBtn"
                    type="button"
                    aria-label="Odjavi se"
                    class="inline-flex items-center gap-1.5 text-xs text-neutral-400 hover:text-neutral-100 active:text-white transition px-3 py-2 rounded-lg hover:bg-neutral-900 border border-transparent hover:border-neutral-800">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"/>
                    </svg>
                    <span>Odjavi se</span>
                </button>
            </div>

            <!-- Camera still -->
            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="relative w-full aspect-video bg-neutral-950">
                    <!-- Decodes the stream just long enough to grab one frame. Kept at
                         opacity 0 rather than display:none, a hidden video is not
                         guaranteed to render frames we can copy. -->
                    <video
                        id="cameraVideo"
                        class="absolute inset-0 w-full h-full object-cover opacity-0 pointer-events-none"
                        autoplay
                        muted
                        playsinline
                        aria-hidden="true"></video>

                    <canvas id="frameCanvas" class="absolute inset-0 w-full h-full object-cover"></canvas>

                    <div id="frameOverlay"
                         class="absolute inset-0 flex items-center justify-center text-sm text-neutral-500 pointer-events-none">
                        Ni slike
                    </div>

                    <div id="frameStamp"
                         class="hidden absolute bottom-2 left-2 sm:bottom-3 sm:left-3 bg-black/60 backdrop-blur-sm px-2 py-1 rounded-md pointer-events-none text-[10px] sm:text-xs font-mono text-neutral-200"></div>
                </div>
            </div>

            <!-- Unlock -->
            <div class="w-full max-w-sm sm:max-w-md mx-auto flex flex-col items-center px-8 mt-2">
                <button
                    id="openBtn"
                    type="button"
                    class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 disabled:bg-neutral-700 disabled:cursor-not-allowed disabled:shadow-none text-neutral-950 font-semibold rounded-2xl py-5 sm:py-6 text-lg sm:text-xl tracking-wide transition-all shadow-lg shadow-emerald-500/30 hover:shadow-xl hover:shadow-emerald-500/40 ring-1 ring-emerald-400/30 flex items-center justify-center gap-2.5">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
                    </svg>
                    <span id="openLabel">Odpri</span>
                </button>
                <p id="statusMsg" class="mt-3 text-sm text-center text-neutral-400 min-h-[1.25rem]" aria-live="polite"></p>
            </div>

        </section>

    </main>

<script>
(() => {
    'use strict';

    // Single-frame variant of index.html: instead of keeping the HLS feed
    // playing, it allocates a stream, copies the first decoded frame onto a
    // canvas, then tears the stream down. The refresh button repeats that.
    // Same endpoint, same key handling and same unlock call as index.html.

    const STORAGE_KEY = '_dk';
    const ENDPOINT = '../../../app/proxys/vrata.php';
    const REQUEST_TIMEOUT_MS = 10000;
    const FRAME_TIMEOUT_MS = 15000;   // stream attached -> first decoded frame
    const WARMUP_TIMEOUT_MS = 20000;  // first frame -> real picture (see waitForPicture)
    const PROBE_INTERVAL_MS = 300;
    const BLIND_WARMUP_MS = 8000;
    const BLANK_LUMA = 6;

    const keyView      = document.getElementById('keyView');
    const actionView   = document.getElementById('actionView');
    const keyForm      = document.getElementById('keyForm');
    const keyInput     = document.getElementById('keyInput');
    const openBtn      = document.getElementById('openBtn');
    const openLabel    = document.getElementById('openLabel');
    const forgetBtn    = document.getElementById('forgetBtn');
    const refreshBtn   = document.getElementById('refreshBtn');
    const refreshIcon  = document.getElementById('refreshIcon');
    const statusMsg    = document.getElementById('statusMsg');
    const cameraVideo  = document.getElementById('cameraVideo');
    const frameCanvas  = document.getElementById('frameCanvas');
    const frameOverlay = document.getElementById('frameOverlay');
    const frameStamp   = document.getElementById('frameStamp');

    let inFlight = false;
    let hls = null;
    let capturing = false;
    let captureToken = 0;

    const safeGetKey = () => {
        try { return localStorage.getItem(STORAGE_KEY); }
        catch { return null; }
    };
    const safeSetKey = (v) => {
        try { localStorage.setItem(STORAGE_KEY, v); return true; }
        catch { return false; }
    };
    const safeClearKey = () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch {}
    };

    const setOverlay = (text) => {
        frameOverlay.textContent = text || '';
        frameOverlay.classList.toggle('hidden', !text);
    };

    const showView = (which) => {
        keyView.classList.toggle('hidden', which !== 'key');
        actionView.classList.toggle('hidden', which !== 'action');
        if (which === 'key') {
            keyInput.value = '';
            setTimeout(() => keyInput.focus(), 0);
            teardownStream();
        } else if (which === 'action') {
            captureFrame();
        }
    };

    // The key is sent in the JSON body of a POST, never in the URL: query
    // strings leak into logs/history/Referer and a GET would let link-preview
    // and prefetch bots trip the door (SEC-03). credentials:'same-origin' so
    // the session cookie flows, letting a signed-in user with the vrata role
    // work even without a key.
    const callEndpoint = (payload, signal) => fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        credentials: 'same-origin',
        cache: 'no-store',
        redirect: 'error',
        referrerPolicy: 'no-referrer',
        signal,
    });

    const fetchStreamUrl = async (signal) => {
        const key = safeGetKey();
        const res = await callEndpoint({ action: 'stream', key: key || '' }, signal);
        if (res.status === 403 || res.status === 401) {
            safeClearKey();
            showView('key');
            throw new Error('forbidden');
        }
        if (!res.ok) throw new Error('http_' + res.status);
        const data = await res.json();
        if (!data || !data.url) throw new Error('no_url');
        return data.url;
    };

    const teardownStream = () => {
        if (hls) { try { hls.destroy(); } catch {} hls = null; }
        try {
            cameraVideo.pause();
            cameraVideo.removeAttribute('src');
            cameraVideo.load();
        } catch {}
    };

    /** Resolves once the video has decoded a frame we can copy. */
    const waitForFirstFrame = (token) => new Promise((resolve, reject) => {
        let settled = false;
        const finish = (err) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            cameraVideo.removeEventListener('loadeddata', onData);
            cameraVideo.removeEventListener('playing', onData);
            cameraVideo.removeEventListener('error', onError);
            err ? reject(err) : resolve();
        };
        const timer = setTimeout(() => finish(new Error('frame_timeout')), FRAME_TIMEOUT_MS);
        const onData = () => {
            if (token !== captureToken) return finish(new Error('stale'));
            if (cameraVideo.videoWidth > 0) setTimeout(() => finish(null), 120);
        };
        const onError = () => finish(new Error('video_error'));

        if (typeof cameraVideo.requestVideoFrameCallback === 'function') {
            cameraVideo.requestVideoFrameCallback(() => {
                if (token !== captureToken) return finish(new Error('stale'));
                finish(cameraVideo.videoWidth > 0 ? null : new Error('no_frame'));
            });
        }
        cameraVideo.addEventListener('loadeddata', onData);
        cameraVideo.addEventListener('playing', onData);
        cameraVideo.addEventListener('error', onError);
    });

    // Tuya's HLS stream opens with roughly six seconds of a black "waking up"
    // placeholder (measured: mean luma 0.4 until ~6s of media time, then the
    // real picture at ~97). Grabbing the literal first frame therefore yields a
    // black square with a spinner, so we sample the frame until it stops being
    // black.
    const probeCanvas = document.createElement('canvas');
    probeCanvas.width = 64;
    probeCanvas.height = 36;
    const probeCtx = probeCanvas.getContext('2d', { willReadFrequently: true });

    /** Mean luma 0-255 of the current frame, or null if pixels can't be read. */
    const frameLuma = () => {
        try {
            probeCtx.drawImage(cameraVideo, 0, 0, probeCanvas.width, probeCanvas.height);
            const d = probeCtx.getImageData(0, 0, probeCanvas.width, probeCanvas.height).data;
            let sum = 0;
            for (let p = 0; p < d.length; p += 4) {
                sum += 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
            }
            return sum / (d.length / 4);
        } catch {
            // Safari's native-HLS path taints the canvas (the playlist is
            // cross-origin and MSE isn't in play), so readback throws. Drawing
            // still works, we just can't inspect: fall back to a blind wait.
            return null;
        }
    };

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    /** Waits for the placeholder to give way to real picture. */
    const waitForPicture = async (token) => {
        const deadline = Date.now() + WARMUP_TIMEOUT_MS;
        while (Date.now() < deadline) {
            if (token !== captureToken) throw new Error('stale');
            const luma = frameLuma();
            if (luma === null) {
                // Pixels unreadable: wait out the known warm-up instead.
                await sleep(BLIND_WARMUP_MS);
                return;
            }
            if (luma >= BLANK_LUMA) return;
            await sleep(PROBE_INTERVAL_MS);
        }
        // Timed out still black. Paint it anyway, a dark frame beats no frame.
    };

    const paintFrame = () => {
        const w = cameraVideo.videoWidth;
        const h = cameraVideo.videoHeight;
        if (!w || !h) return false;
        frameCanvas.width = w;
        frameCanvas.height = h;
        frameCanvas.getContext('2d').drawImage(cameraVideo, 0, 0, w, h);
        return true;
    };

    const attachStream = (url) => new Promise((resolve, reject) => {
        if (!window.Hls || !Hls.isSupported()) {
            if (!cameraVideo.canPlayType('application/vnd.apple.mpegurl')) {
                reject(new Error('hls_unsupported'));
                return;
            }
            cameraVideo.src = url;
            cameraVideo.play().catch(() => {});
            resolve();
            return;
        }

        // Settle on the manifest rather than on attach, so a dead stream URL
        // fails here instead of waiting out the first-frame timeout.
        let settled = false;
        const finish = (err) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            err ? reject(err) : resolve();
        };
        const timer = setTimeout(() => finish(new Error('manifest_timeout')), FRAME_TIMEOUT_MS);

        hls = new Hls({ liveDurationInfinity: true, lowLatencyMode: false });
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            cameraVideo.play().catch(() => {});
            finish(null);
        });
        hls.on(Hls.Events.ERROR, (_evt, data) => {
            if (data.fatal) finish(new Error('hls_fatal'));
        });
        hls.loadSource(url);
        hls.attachMedia(cameraVideo);
    });

    const captureFrame = async () => {
        if (capturing) return;
        capturing = true;
        const token = ++captureToken;

        refreshBtn.disabled = true;
        refreshIcon.classList.add('animate-spin');
        setOverlay('Zajemam sliko…');

        teardownStream();

        const controller = new AbortController();
        const reqTimer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        try {
            const url = await fetchStreamUrl(controller.signal);
            clearTimeout(reqTimer);
            if (token !== captureToken) return;

            await attachStream(url);
            await waitForFirstFrame(token);
            if (token !== captureToken) return;

            setOverlay('Kamera se prebuja…');
            await waitForPicture(token);
            if (token !== captureToken) return;

            if (!paintFrame()) throw new Error('no_frame');

            setOverlay('');
            // The camera burns its own clock into the picture and HLS buffering
            // puts that ~10s behind, so label ours as the fetch time to make
            // the two readings obviously different things.
            frameStamp.textContent = 'Osveženo ' + new Date().toLocaleTimeString('sl-SI');
            frameStamp.classList.remove('hidden');
        } catch (err) {
            if (err.message !== 'forbidden' && err.message !== 'stale') {
                setOverlay(err.message === 'hls_unsupported'
                    ? 'HLS ni podprt v tem brskalniku.'
                    : 'Slike ni bilo mogoče zajeti.');
            }
        } finally {
            clearTimeout(reqTimer);
            teardownStream();
            capturing = false;
            refreshBtn.disabled = false;
            refreshIcon.classList.remove('animate-spin');
        }
    };

    const setStatus = (text, tone) => {
        statusMsg.textContent = text || '';
        statusMsg.className = 'mt-3 text-sm text-center min-h-[1.25rem] ' + (
            tone === 'ok'   ? 'text-emerald-400' :
            tone === 'err'  ? 'text-red-400'     :
                              'text-neutral-400'
        );
    };

    const init = () => {
        const stored = safeGetKey();
        if (stored && stored.length > 0) {
            showView('action');
        } else {
            showView('key');
        }
    };

    keyForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = keyInput.value.trim();
        if (!v) return;
        if (!safeSetKey(v)) {
            setStatus('Could not save key on this device.', 'err');
            return;
        }
        keyInput.value = '';
        showView('action');
        setStatus('', null);
    });

    forgetBtn.addEventListener('click', () => {
        safeClearKey();
        setStatus('', null);
        showView('key');
    });

    refreshBtn.addEventListener('click', () => captureFrame());

    openBtn.addEventListener('click', async () => {
        if (inFlight) return;
        const key = safeGetKey();

        inFlight = true;
        openBtn.disabled = true;
        openLabel.textContent = 'Odpiranje...';
        setStatus('', null);

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        try {
            const res = await callEndpoint({ key: key || '' }, controller.signal);

            if (res.status === 401 || res.status === 403) {
                setStatus('Key rejected.', 'err');
                safeClearKey();
                showView('key');
                return;
            }
            if (res.status === 429) {
                setStatus('Too many attempts. Wait a few minutes.', 'err');
                return;
            }
            if (!res.ok) {
                setStatus('Request failed (' + res.status + ').', 'err');
                return;
            }

            setStatus('Unlocked.', 'ok');
        } catch (err) {
            if (err.name === 'AbortError') {
                setStatus('Timed out.', 'err');
            } else {
                setStatus('Network error.', 'err');
            }
        } finally {
            clearTimeout(timer);
            inFlight = false;
            openBtn.disabled = false;
            openLabel.textContent = 'Odpri';
        }
    });

    init();
})();
</script>
</body>
</html>
